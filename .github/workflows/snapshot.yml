name: catalog snapshot

# Free read replica of the Supabase `swfs` table: one gzipped file, refreshed
# daily, committed only when the rows actually changed.
on:
  schedule:
    - cron: "17 4 * * *"   # 04:17 UTC daily
  workflow_dispatch: {}    # Actions -> catalog snapshot -> Run workflow

permissions:
  contents: write

concurrency:
  group: catalog-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the catalog
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python snapshot.py

      - name: Commit when it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json.gz catalog.meta.json
          if git diff --cached --quiet; then
            echo "Catalog unchanged - nothing to commit."
            exit 0
          fi
          count=$(python -c "import json;print(json.load(open('catalog.meta.json'))['count'])")
          git commit -m "catalog snapshot: ${count} items"
          git push
